services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tidal
      POSTGRES_PASSWORD: "tmXPnueUK7VVNDUWUjpHPw1PftNk5Vlf"
    volumes:
      - tidal_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "iuP9SFevG8ZHwbN3_2_1z7fz_E87mRZx"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tidal_test
      POSTGRES_PASSWORD: "uvL2pe2g54m8VXBReptyxdQsA2jROkfP"
    volumes:
      - tidal_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "QsPg-ZQRupSVglOl6K7cNYrtvEzgd8-N"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  tidal_data:
  tidal_test_data:
